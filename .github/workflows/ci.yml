name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  strict:
    name: Build with -Werror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make strict
      - name: List binaries
        run: ls -l build/

  sanitizers:
    name: Build with ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make debug

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check src/ against .clang-format
        run: clang-format --style=file --dry-run --Werror src/*.c src/*.h
