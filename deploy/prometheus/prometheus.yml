global:
  scrape_interval: 1s
  scrape_timeout: 500ms
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The server process. Userspace view: what reached accept() and what the
  # server itself turned away.
  - job_name: concurrent-servers
    static_configs:
      - targets:
          - host.docker.internal:9110

  # The kernel. Connections dropped before accept() ever saw them.
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
